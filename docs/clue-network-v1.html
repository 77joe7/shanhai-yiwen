(function buildRelLinks(){
  const ids=Object.keys(REL_MATRIX);
  for(let i=0;i<ids.length;i++){
    for(let j=i+1;j<ids.length;j++){
      const a=REL_MATRIX[ids[i]],b=REL_MATRIX[ids[j]];
      let co=0;
      for(let k=0;k<8;k++){ if(a[k]>0&&b[k]>0) co+=Math.min(a[k],b[k]); }
      if(co>0) relLinksRaw.push({s:ids[i],t:ids[j],w:co});
    }
  }
})();

  let raw=clueNodes;
  if(chainFilter!=="ALL") raw=clueNodes.filter(n=>n.chain===chainFilter||n.chain==="HUB");
  nodes=raw.map((n,i)=>({...n,_x:W/2+(Math.random()-0.5)*400,_y:H/2+(Math.random()-0.5)*300}));
  // 重新映射 HUB 连接：仅保留两端都存在的边
  let lk=clueLinksRaw.map(([s,t])=>({s,t}));
  if(chainFilter!=="ALL"){
    const vis=new Set(nodes.map(n=>n.id));
    lk=lk.filter(([s,t])=>vis.has(s)&&vis.has(t));
  }
  links=resolveLinks(lk);
}
function buildRelData(showHide){
  nodes=relNodes.map((n,i)=>({...n,_x:W/2+(Math.random()-0.5)*400,_y:H/2+(Math.random()-0.5)*300}));
  const normal=relLinksRaw.map(l=>({s:l.s,t:l.t,w:l.w}));
  const hide=showHide?relHideRaw.map(l=>({s:l.s,t:l.t,w:2,hide:true,label:l.label})):[];
  links=resolveLinks(normal.concat(hide));
}
function tick(){
  const k=2200, ks=0.03, restN=64, restHub=120, grav=0.012, damp=0.82;
  for(let i=0;i<nodes.length;i++){
    const a=nodes[i];
    if(a===dragNode) continue;
    for(let j=i+1;j<nodes.length;j++){
      const b=nodes[j];
      let dx=a._x-b._x, dy=a._y-b._y;
      let d2=dx*dx+dy*dy; if(d2<0.01)d2=0.01;
      const d=Math.sqrt(d2);
      const f=k/d2*alpha;
      const ux=dx/d, uy=dy/d;
      if(a!==dragNode){a._x+=f*ux; a._y+=f*uy;}
      if(b!==dragNode){b._x-=f*ux; b._y-=f*uy;}
    }
  }
  for(const l of links){
    const s=l.source,t=l.target;
    let dx=t._x-s._x, dy=t._y-s._y;
    let d=Math.sqrt(dx*dx+dy*dy)||0.01;
    const rest=(s.type==="HUB"||t.type==="HUB")?restHub:restN;
    const f=ks*(d-rest)*alpha;
    const ux=dx/d, uy=dy/d;
    if(s!==dragNode){s._x+=f*ux; s._y+=f*uy;}
    if(t!==dragNode){t._x-=f*ux; t._y-=f*uy;}
  }
  for(const n of nodes){
    if(n===dragNode) continue;
    n._x+=(W/2-n._x)*grav;
    n._y+=(H/2-n._y)*grav;
    n._x=Math.max(40,Math.min(W-40,n._x));
    n._y=Math.max(36,Math.min(H-36,n._y));
  }
  if(dragNode){ dragNode._x=dragNode._x; dragNode._y=dragNode._y; }
  render();
  alpha*=0.985;
  if(alpha>0.03){ rafId=requestAnimationFrame(tick); }
  else { rafId=null; }
}
function reheat(){ alpha=1; if(rafId) cancelAnimationFrame(rafId); rafId=requestAnimationFrame(tick); }

/* ============ 渲染 ============ */
let linkEls=[],nodeEls=[];
function render(){
  // 更新边
  links.forEach((l,i)=>{
    const el=linkEls[i];
    if(!el) return;
    const x1=l.source._x,y1=l.source._y,x2=l.target._x,y2=l.target._y;
    el.setAttribute("x1",x1);el.setAttribute("y1",y1);
    el.setAttribute("x2",x2);el.setAttribute("y2",y2);
  });
  // 更新节点
  nodes.forEach((n,i)=>{
    const g=nodeEls[i]; if(!g) return;
    g.setAttribute("transform",`translate(${n._x},${n._y})`);
  });
}
function colorOf(n){ return currentMode==="clue"?CLUE_GROUPS[n.type].color:FACTION[n.faction].color; }
function radiusOf(n){
  if(currentMode==="clue") return n.type==="HUB"?16:(n.type==="R"||n.type==="F")?11:10;
  return n.faction==="EXTERNAL"?12:14;
}
function buildSVG(){
  svg.innerHTML="";
  linkEls=[];nodeEls=[];
  const linkLayer=document.createElementNS(SVG_NS,"g");
  const nodeLayer=document.createElementNS(SVG_NS,"g");
  svg.appendChild(linkLayer);svg.appendChild(nodeLayer);
  links.forEach(l=>{
    const line=document.createElementNS(SVG_NS,"line");
    const isHide=l.hide;
    line.setAttribute("stroke",isHide?"#c0392b":"#b9c0cc");
    line.setAttribute("stroke-width",isHide?2:(0.8+(l.w||1)*0.5));
    if(isHide) line.setAttribute("stroke-dasharray","5 4");
    line.setAttribute("opacity",isHide?0.9:0.55);
    line._link=l;
    linkLayer.appendChild(line);
    linkEls.push(line);
  });
  nodes.forEach(n=>{
    const g=document.createElementNS(SVG_NS,"g");
    g.setAttribute("class","node");
    const c=document.createElementNS(SVG_NS,"circle");
    c.setAttribute("r",radiusOf(n));
    c.setAttribute("fill",colorOf(n));
    c.setAttribute("stroke",n.type==="HUB"?"#b7950b":"#ffffff");
    c.setAttribute("stroke-width",n.type==="HUB"?3:2);
    const t=document.createElementNS(SVG_NS,"text");
    t.setAttribute("class","node-label");
    t.setAttribute("text-anchor","middle");
    t.setAttribute("dy",radiusOf(n)+13);
    t.textContent=n.label;
    g.appendChild(c);g.appendChild(t);
    g._node=n;
    nodeLayer.appendChild(g);
    nodeEls.push(g);
    // 交互
    g.addEventListener("mouseenter",()=>highlight(n));
    g.addEventListener("mouseleave",()=>clearHighlight());
    g.addEventListener("click",()=>showInfo(n));
    g.addEventListener("mousedown",(e)=>startDrag(e,n));
  });
  render();
}
function neighbors(n){
  const set=new Set([n.id]);
  links.forEach(l=>{
    if(l.source===n) set.add(l.target.id);
    if(l.target===n) set.add(l.source.id);
  });
  return set;
}
function highlight(n){
  const nb=neighbors(n);
  nodeEls.forEach(g=>{ g.style.opacity = nb.has(g._node.id)?1:0.18; });
  linkEls.forEach(el=>{
    const l=el._link;
    const on=(l.source===n||l.target===n);
    el.style.opacity = on?1:0.08;
  });
}
function clearHighlight(){
  nodeEls.forEach(g=>g.style.opacity=1);
  linkEls.forEach(el=>{ el.style.opacity = el._link.hide?0.9:0.55; });
}
function showInfo(n){
  let html=`<h3>${n.label}</h3>`;
  if(currentMode==="clue"){
    html+=`<span class="tag" style="background:${CLUE_GROUPS[n.type].color}">${CLUE_GROUPS[n.type].name}</span>`;
    const chainName={"L1":"L1 黑雨吃名字（样板线）","L2":"L2 昼盐真相","L3":"L3 三影尸体归属",
      "L4":"L4 赤金箭来源","L5":"L5 十日征兆","L6":"L6 阿禾命名簿","L7":"L7 季缨守井",
      "L8":"L8 北方交易","HUB":"汇流 / 跨卷"}[n.chain]||n.chain;
    html+=`<div class="kv"><b>所属链：</b>${chainName}</div>`;
    if(n.meta) html+=`<div class="kv"><b>关键 flag / 节点：</b>${n.meta}</div>`;
  }else{
    html+=`<span class="tag" style="background:${FACTION[n.faction].color}">${FACTION[n.faction].name}</span>`;
    if(n.meta) html+=`<div class="kv"><b>设定：</b>${n.meta}</div>`;
    const row=REL_MATRIX[n.id];
    if(row){
      const chs=["L1吃名字","L2昼盐","L3尸体","L4赤金箭","L5十日","L6命名簿","L7守井","L8北方"];
      const marks=row.map((v,i)=>v===3?"●"+chs[i]:v===2?"◐"+chs[i]:v===1?"○"+chs[i]:null).filter(Boolean);
      html+=`<div class="kv"><b>线索参与：</b>${marks.join("　")||"（外部节点，仅经隐瞒-追查边接入）"}</div>`;
    }
  }
  info.innerHTML=html;
}

/* ============ 图例 ============ */
function buildLegend(){
  if(currentMode==="clue"){
    let h="<div style='font-weight:700;margin-bottom:4px'>节点类型（R/A/E/C/D/F）</div>";
    for(const k of ["R","A","E","C","D","F","HUB"]){
      h+=`<div class="row"><span class="dot" style="background:${CLUE_GROUPS[k].color}"></span>${CLUE_GROUPS[k].name}</div>`;
    }
    h+=`<div style="margin-top:6px;color:#6b7280">边：线索流向（R→A→E→C→D→F→汇流）</div>`;
    legend.innerHTML=h;
  }else{
    let h="<div style='font-weight:700;margin-bottom:4px'>阵营（节点颜色）</div>";
    for(const k in FACTION) h+=`<div class="row"><span class="dot" style="background:${FACTION[k].color}"></span>${FACTION[k].name}</div>`;
    h+=`<div class="row" style="margin-top:6px"><span class="bar" style="background:#b9c0cc"></span>共享线索（粗细=共现强度）</div>`;
    h+=`<div class="row"><span class="bar" style="background:#c0392b"></span>隐瞒↔追查（虚线红）</div>`;
    legend.innerHTML=h;
  }
}

/* ============ 交互：拖拽 ============ */
function svgPoint(evt){
  const pt=svg.createSVGPoint();
  pt.x=evt.clientX; pt.y=evt.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function startDrag(evt,n){
  evt.preventDefault();
  dragNode=n; svg.classList.add("dragging");
  const move=(e)=>{
    const p=svgPoint(e);
    n._x=p.x; n._y=p.y; n._fx=p.x; n._fy=p.y;
    render();
  };
  const up=()=>{
    dragNode=null; svg.classList.remove("dragging");
    window.removeEventListener("mousemove",move);
    window.removeEventListener("mouseup",up);
  };
  window.addEventListener("mousemove",move);
  window.addEventListener("mouseup",up);
}

/* ============ 模式切换 ============ */
function switchMode(mode){
  currentMode=mode;
  document.getElementById("tab-clue").classList.toggle("active",mode==="clue");
  document.getElementById("tab-rel").classList.toggle("active",mode==="rel");
  document.getElementById("clue-ctl").style.display = mode==="clue"?"flex":"none";
  document.getElementById("rel-ctl").style.display = mode==="rel"?"flex":"none";
  info.innerHTML=`<h3>详情</h3><div class="empty">点击任意节点查看其类型、所属线索链 / 阵营与关键 flag。</div>`;
  if(mode==="clue") buildClueData(document.getElementById("chain-sel").value);
  else buildRelData(document.getElementById("toggle-hide").checked);
  buildSVG(); buildLegend(); reheat();
}

document.getElementById("tab-clue").onclick=()=>switchMode("clue");
document.getElementById("tab-rel").onclick=()=>switchMode("rel");
document.getElementById("chain-sel").onchange=(e)=>{ buildClueData(e.target.value); buildSVG(); reheat(); };
document.getElementById("toggle-hide").onchange=(e)=>{ buildRelData(e.target.checked); buildSVG(); buildLegend(); reheat(); };
document.getElementById("reheat-clue").onclick=reheat;
document.getElementById("reheat-rel").onclick=reheat;

// 初始
switchMode("clue");
</script>
</body>
</html>
